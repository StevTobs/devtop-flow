[package]
name = "devtop-flow"
version = "1.1.0"
description = "DevTop Flow — standalone macOS IDE with built-in LLM support"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-http = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"

# API keys go in the OS-native credential store — Keychain on macOS,
# Credential Manager on Windows — never plaintext config (build plan §3, §8).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[[bin]]
name = "devtop-flow"
path = "src/main.rs"
